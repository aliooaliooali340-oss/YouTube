<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ff0000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>YOUTUBE</title>

<link rel="preconnect" href="https://i.ytimg.com" crossorigin>
<link rel="preconnect" href="https://www.googleapis.com" crossorigin>
<link rel="preconnect" href="https://suggestqueries.google.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; }
html { -webkit-text-size-adjust:100%; }

:root {
    --red: #ff0000;
    --red-2: #e60000;
    --red-3: #cc0000;
    --red-dark: #990000;
    --red-bg: #ffe5e5;
    --red-glow: rgba(255, 0, 0, 0.25);
    --red-glow-2: rgba(255, 0, 0, 0.4);
    --bg: #f9f9f9;
    --bg-2: #f1f1f1;
    --white: #ffffff;
    --text: #0f0f0f;
    --text-dim: #606060;
    --text-muted: #909090;
    --border: #e5e5e5;
    --border-2: #d9d9d9;
    --black: #212121;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.06);
    --shadow: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
    --shadow-xl: 0 20px 50px rgba(0,0,0,0.2);
    --radius: 12px;
    --radius-sm: 8px;
    --radius-lg: 20px;
    --radius-xl: 28px;
}

body {
    font-family: 'Cairo', 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    direction: rtl;
    min-height: 100vh;
    min-height: 100dvh;
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    overscroll-behavior-y: contain;
}

/* HEADER */
.header {
    position: sticky; top: 0; z-index: 100;
    background: var(--white);
    padding-top: env(safe-area-inset-top);
    box-shadow: 0 1px 0 rgba(0,0,0,0.06);
    border-bottom: 1px solid var(--border);
}

.header-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; height: 56px; gap: 8px;
}

.header-icon-btn {
    width: 40px; height: 40px; border: none; background: transparent;
    color: var(--text); font-size: 20px; cursor: pointer;
    border-radius: 50%; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0; font-family: inherit;
    transition: background 0.15s, transform 0.15s;
}
.header-icon-btn:hover { background: var(--bg-2); }
.header-icon-btn:active { background: var(--border); transform: scale(0.92); }

.header-logo {
    display: flex; align-items: center; gap: 6px;
    font-size: 22px; font-weight: 900; color: var(--text);
    text-decoration: none; flex-shrink: 0;
    letter-spacing: -0.5px;
}

.logo-icon {
    width: 42px; height: 30px;
    background: var(--red);
    border-radius: 8px; display: flex; align-items: center;
    justify-content: center; color: #fff; font-size: 15px;
    font-weight: 900; box-shadow: 0 4px 12px var(--red-glow);
    position: relative; overflow: hidden;
    transition: transform 0.2s;
}
.logo-icon:active { transform: scale(0.94); }
.logo-icon::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.3) 50%, transparent 70%);
    animation: shine 4s ease-in-out infinite;
}
@keyframes shine {
    0%, 100% { transform: translateX(-150%); }
    50% { transform: translateX(150%); }
}

.logo-text {
    color: var(--text);
    font-weight: 900;
    letter-spacing: -1px;
}
.logo-text sup {
    font-size: 9px; color: var(--text-muted);
    font-weight: 500; margin-right: 2px;
}

.notif-dot {
    position: absolute; top: 8px; right: 8px;
    width: 8px; height: 8px; background: var(--red);
    border-radius: 50%; border: 2px solid var(--white);
    animation: pulseDot 1.8s infinite;
}
@keyframes pulseDot {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.6); }
    50% { transform: scale(1.1); box-shadow: 0 0 0 5px rgba(255, 0, 0, 0); }
}

/* SEARCH */
.search-section { padding: 8px 12px 10px; position: relative; }

.search-row {
    display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
}

.mic-btn {
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--bg-2); border: 1px solid var(--border);
    color: var(--text); font-size: 19px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-family: inherit; transition: transform 0.15s;
}
.mic-btn:active { background: var(--border); transform: scale(0.92); }

.search-input-wrap { flex: 1; position: relative; }

.search-input {
    width: 100%; height: 46px; padding: 0 45px 0 18px;
    border: 1.5px solid var(--border-2); border-radius: 24px;
    background: var(--white); color: var(--text);
    font-size: 15px; font-family: inherit; outline: none;
    transition: all 0.25s; font-weight: 500;
}
.search-input::placeholder { color: var(--text-muted); font-weight: 400; }
.search-input:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 3px var(--red-glow);
}

.search-clear-btn {
    position: absolute; left: 8px; top: 50%; transform: translateY(-50%);
    width: 30px; height: 30px; border-radius: 50%; border: none;
    background: var(--bg-2); color: var(--text-dim);
    font-size: 14px; cursor: pointer; display: none;
    align-items: center; justify-content: center; font-family: inherit;
}
.search-clear-btn.show { display: flex; }

.lens-btn {
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--bg-2); border: 1px solid var(--border);
    color: var(--text); font-size: 19px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-family: inherit; position: relative;
    transition: transform 0.15s;
}
.lens-btn:active { transform: scale(0.92); }

/* SUGGESTIONS */
.suggestions-box {
    position: absolute; top: 100%; left: 12px; right: 12px;
    background: var(--white); border-radius: var(--radius);
    box-shadow: var(--shadow-xl); z-index: 200;
    max-height: 360px; overflow-y: auto;
    display: none; margin-top: 4px;
    border: 1px solid var(--border);
}
.suggestions-box.show { display: block; }
.suggestion-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 16px; cursor: pointer;
    font-size: 14px; color: var(--text); font-weight: 500;
    transition: background 0.15s; border: none;
    background: transparent; width: 100%; text-align: right;
    font-family: inherit;
}
.suggestion-item:hover, .suggestion-item:active { background: var(--bg-2); }
.suggestion-item .icon { font-size: 16px; color: var(--text-muted); flex-shrink: 0; }
.suggestion-item .text { flex: 1; }
.suggestion-item .text b { color: var(--text); font-weight: 800; }
.suggestion-item .arrow { color: var(--text-muted); font-size: 12px; }

/* CHIPS */
.chips-row {
    display: flex; gap: 8px; overflow-x: auto;
    padding: 4px 12px 10px;
    scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.chips-row::-webkit-scrollbar { display: none; }

.chip {
    padding: 8px 16px; border-radius: 20px;
    border: none; background: var(--bg-2);
    color: var(--text); font-size: 13.5px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    white-space: nowrap; flex-shrink: 0;
    transition: all 0.2s;
}
.chip:hover { background: var(--border); }
.chip.active {
    background: var(--black); color: var(--white);
    font-weight: 700;
}
.chip:active { transform: scale(0.94); }

/* FEED */
.feed { padding: 6px 0 20px; }

.video-card {
    display: block; margin-bottom: 12px;
    background: var(--white);
    cursor: pointer; text-decoration: none;
    color: inherit; width: 100%; padding: 0;
    text-align: right; font-family: inherit;
    border: none; transition: background 0.2s;
}
.video-card:active { background: var(--bg-2); }

.v-thumb {
    position: relative; width: 100%;
    aspect-ratio: 16 / 9;
    background: linear-gradient(135deg, var(--bg-2), var(--border));
    overflow: hidden;
}
.v-thumb img {
    width: 100%; height: 100%; object-fit: cover;
    display: block; opacity: 0;
    transition: opacity 0.35s, transform 0.4s;
}
.v-thumb img.loaded { opacity: 1; }
.video-card:hover .v-thumb img { transform: scale(1.03); }

.v-thumb .duration {
    position: absolute; bottom: 8px; left: 8px;
    background: rgba(0, 0, 0, 0.85);
    color: #fff; font-size: 12px;
    font-weight: 700; padding: 3px 7px;
    border-radius: 4px; font-family: 'Roboto', sans-serif;
    letter-spacing: 0.3px;
}

.v-body {
    display: flex; gap: 12px;
    padding: 12px;
}
.v-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(135deg, var(--red), var(--red-2));
    color: #fff; display: flex; align-items: center;
    justify-content: center; font-weight: 800;
    font-size: 15px; flex-shrink: 0;
    text-transform: uppercase;
}
.v-text { flex: 1; min-width: 0; }
.v-title {
    font-size: 14.5px; font-weight: 700;
    color: var(--text); line-height: 1.4;
    margin-bottom: 5px; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;
}
.v-meta {
    font-size: 12px; color: var(--text-dim);
    line-height: 1.5; font-weight: 500;
}
.v-meta .v-dot { margin: 0 3px; opacity: 0.6; }

/* MODAL */
.modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.85);
    z-index: 2000; display: none;
    justify-content: center; align-items: center;
    padding: 0; opacity: 0;
    transition: opacity 0.3s ease;
}
.modal-backdrop.show {
    display: flex; opacity: 1;
    animation: fadeIn 0.3s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.modal-container {
    width: 100%; max-width: 900px; max-height: 100vh;
    background: var(--white);
    overflow: hidden;
    display: flex; flex-direction: column;
    transform: scale(0.95); opacity: 0;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s;
    position: relative;
}
.modal-backdrop.show .modal-container {
    transform: scale(1); opacity: 1;
}

.modal-header {
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--white);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}
.modal-header-info {
    display: flex; align-items: center;
    gap: 8px; min-width: 0; flex: 1;
}
.modal-logo {
    width: 32px; height: 22px;
    background: var(--red); border-radius: 5px;
    display: flex; align-items: center;
    justify-content: center; color: #fff;
    font-size: 11px; font-weight: 900;
    flex-shrink: 0;
}
.modal-header-title {
    font-size: 13px; font-weight: 700;
    color: var(--text); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
}
.modal-close-btn {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--bg-2); border: none;
    color: var(--text); font-size: 15px;
    cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    transition: background 0.15s; flex-shrink: 0;
}
.modal-close-btn:active { background: var(--border); }

.modal-player-wrap {
    position: relative; width: 100%;
    aspect-ratio: 16 / 9;
    background: #000; flex-shrink: 0;
}
.modal-player-wrap iframe,
.modal-player-wrap > div {
    position: absolute; inset: 0;
    width: 100%; height: 100%; border: none;
}

.modal-info {
    padding: 14px 16px 20px;
    overflow-y: auto; flex: 1; min-height: 0;
}
.modal-info::-webkit-scrollbar { width: 6px; }
.modal-info::-webkit-scrollbar-thumb {
    background: var(--border-2); border-radius: 6px;
}

.modal-title {
    font-size: 16px; font-weight: 800;
    color: var(--text); line-height: 1.4;
    margin-bottom: 12px;
}

.modal-channel-row {
    display: flex; align-items: center;
    gap: 12px; padding: 10px 0 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
}
.modal-channel-av {
    width: 42px; height: 42px; border-radius: 50%;
    background: linear-gradient(135deg, var(--red), var(--red-2));
    color: #fff; display: flex;
    align-items: center; justify-content: center;
    font-weight: 800; font-size: 17px;
    flex-shrink: 0;
}
.modal-channel-info { flex: 1; min-width: 0; }
.modal-channel-name {
    font-size: 14px; font-weight: 700;
    color: var(--text); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
}
.modal-channel-meta {
    font-size: 11.5px; color: var(--text-dim);
    font-weight: 500; margin-top: 1px;
}

.modal-stats {
    display: flex; gap: 12px;
    font-size: 12.5px; color: var(--text-dim);
    font-weight: 600; flex-wrap: wrap;
    padding: 8px 0;
}
.modal-stats span { display: flex; align-items: center; gap: 4px; }

.fullscreen-btn {
    display: flex; align-items: center;
    justify-content: center; gap: 8px;
    width: 100%; padding: 14px 18px;
    margin-top: 12px; border: none;
    border-radius: 12px;
    background: var(--black); color: #fff;
    font-family: inherit; font-size: 15px;
    font-weight: 800; cursor: pointer;
    transition: transform 0.15s, background 0.2s;
    position: relative; overflow: hidden;
}
.fullscreen-btn:active { transform: scale(0.97); background: #000; }
.fullscreen-btn .fs-icon { font-size: 18px; }

.fullscreen-active {
    position: fixed !important;
    inset: 0 !important; z-index: 99999 !important;
    background: #000 !important;
    padding: 0 !important; margin: 0 !important;
    width: 100vw !important; height: 100vh !important;
    height: 100dvh !important;
    display: flex !important; flex-direction: column !important;
    overflow: hidden !important; border-radius: 0 !important;
    max-width: none !important; max-height: none !important;
    box-shadow: none !important; transform: none !important;
    opacity: 1 !important;
}
.fullscreen-active .modal-header {
    background: rgba(0, 0, 0, 0.7) !important;
    border-bottom: none !important;
    position: absolute !important;
    top: 0 !important; left: 0 !important; right: 0 !important;
    z-index: 100 !important;
    backdrop-filter: blur(8px);
    opacity: 0; transition: opacity 0.3s;
    padding-top: calc(8px + env(safe-area-inset-top)) !important;
}
.fullscreen-active:hover .modal-header,
.fullscreen-active.touched .modal-header { opacity: 1; }
.fullscreen-active .modal-header-info { color: #fff; }
.fullscreen-active .modal-header-title { color: #fff !important; }
.fullscreen-active .modal-player-wrap {
    flex: 1 !important; width: 100% !important;
    height: 100% !important; aspect-ratio: auto !important;
}
.fullscreen-active .modal-info { display: none !important; }
.fullscreen-active .modal-close-btn {
    background: rgba(255, 0, 0, 0.95);
    color: #fff;
}

.fs-exit-btn {
    position: fixed; top: 16px; left: 16px;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(255, 0, 0, 0.95);
    color: #fff; border: none; font-size: 17px;
    font-weight: 900; cursor: pointer;
    display: none; align-items: center; justify-content: center;
    z-index: 100001; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    transition: transform 0.15s;
}
.fs-exit-btn.show { display: flex; }
.fs-exit-btn:active { transform: scale(0.9); }

/* AD CARDS */
.ad-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0; margin: 0 12px 12px;
    position: relative; overflow: hidden;
    min-height: 100px; display: block;
}
.ad-card.hidden { display: none; }
.ad-card .ad-tag {
    position: absolute; top: 6px; right: 8px;
    font-size: 9px; font-weight: 800;
    color: var(--text-muted); background: rgba(255,255,255,0.9);
    padding: 2px 8px; border-radius: 4px;
    z-index: 3; border: 1px solid var(--border);
}
.ad-card .ad-x {
    position: absolute; top: 6px; left: 8px;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--white); border: 1px solid var(--border);
    color: var(--text-dim); font-size: 11px;
    cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    z-index: 4; padding: 0;
}
.ad-card .ad-x:active { background: var(--red); color: #fff; border-color: var(--red); }
.ad-card iframe { width: 100%; height: 100px; border: 0; display: block; }
.ad-card.wide iframe { height: 250px; }
.ad-card.tall { min-height: 250px; }

.ad-card .ad-fallback {
    display: flex; align-items: center;
    justify-content: center; gap: 10px;
    padding: 20px; color: var(--text-dim);
    font-size: 13px; font-weight: 600;
}
.ad-card .ad-fallback .ad-logo {
    width: 32px; height: 22px;
    background: var(--red); border-radius: 5px;
    display: flex; align-items: center;
    justify-content: center; color: #fff;
    font-size: 11px; font-weight: 900;
}

/* BOTTOM NAV */
.bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--white);
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-around;
    align-items: center;
    padding: 6px 0 calc(6px + env(safe-area-inset-bottom));
    z-index: 1000;
    box-shadow: 0 -2px 12px rgba(0, 0, 0, 0.04);
}
.nav-item {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3px; padding: 6px 0; border: none;
    background: transparent; color: var(--text-dim);
    font-size: 10.5px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    transition: color 0.2s; max-width: 100px;
    position: relative;
}
.nav-item .nav-icon {
    font-size: 22px; line-height: 1;
    transition: transform 0.2s;
}
.nav-item.active { color: var(--text); font-weight: 800; }
.nav-item.active .nav-icon { transform: scale(1.1); }

/* SKELETON */
.skeleton {
    background: var(--white); margin-bottom: 12px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
}
.skeleton .sk-thumb {
    width: 100%; aspect-ratio: 16 / 9;
    background: linear-gradient(90deg, #e5e5e5 0%, #f5f5f5 50%, #e5e5e5 100%);
    background-size: 200% 100%;
    animation: sk 1.5s ease-in-out infinite;
}
.skeleton .sk-body {
    padding: 12px; display: flex; gap: 12px;
}
.skeleton .sk-avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(90deg, #e5e5e5, #f5f5f5, #e5e5e5);
    background-size: 200% 100%;
    animation: sk 1.5s ease-in-out infinite;
    flex-shrink: 0;
}
.skeleton .sk-lines { flex: 1; }
.skeleton .sk-line {
    height: 12px; border-radius: 4px;
    background: linear-gradient(90deg, #e5e5e5, #f5f5f5, #e5e5e5);
    background-size: 200% 100%;
    animation: sk 1.5s ease-in-out infinite;
    margin-bottom: 8px;
}
.skeleton .sk-line.short { width: 50%; }
@keyframes sk {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
}

.empty { text-align: center; padding: 60px 20px; color: var(--text-dim); }
.empty .icon { font-size: 64px; display: block; margin-bottom: 14px; opacity: 0.4; }
.empty h3 { font-size: 16px; color: var(--text); font-weight: 800; margin-bottom: 6px; }
.empty p { font-size: 13px; color: var(--text-muted); }

.toast {
    position: fixed; bottom: calc(env(safe-area-inset-bottom) + 90px);
    left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--black); color: #fff;
    padding: 12px 22px; border-radius: 24px;
    font-size: 13.5px; font-weight: 700;
    z-index: 99999; opacity: 0;
    transition: 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none; max-width: 90%;
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.3);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.fs-hint {
    position: fixed; bottom: 20px; left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(8px); color: #fff;
    padding: 8px 16px; border-radius: 20px;
    font-size: 12px; font-weight: 700;
    z-index: 100000; opacity: 0;
    pointer-events: none; transition: opacity 0.3s;
}
.fullscreen-active.touched ~ .fs-hint,
.fullscreen-active:hover ~ .fs-hint { opacity: 1; }

@media (min-width: 768px) {
    .feed {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 16px;
        padding: 16px 20px;
    }
    .video-card {
        margin-bottom: 0;
        border-radius: var(--radius);
        overflow: hidden;
        border: 1px solid var(--border);
        box-shadow: var(--shadow-sm);
    }
    .video-card:hover { box-shadow: var(--shadow); }
    .ad-card { margin: 0; }
    .header-row { max-width: 1200px; margin: 0 auto; }
    .search-section { max-width: 1200px; margin: 0 auto; }
    .chips-row { max-width: 1200px; margin: 0 auto; }

function showToast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show';
    clearTimeout(t._timeout);
    t._timeout = setTimeout(() => t.className = 'toast', 2200);
}

// ============================================
// Helpers
// ============================================
function formatViews(n) {
    n = parseInt(n) || 0;
    if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
    return n.toString();
}

function formatDuration(sec) {
    if (!sec) return '';
    const s = parseInt(sec);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const ss = s % 60;
    if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(ss).padStart(2, '0')}`;
    return `${m}:${String(ss).padStart(2, '0')}`;
}

function parseISO(iso) {
    if (!iso) return 0;
    const m = iso.match(/PT(\d+H)?(\d+M)?(\d+S)?/);
    if (!m) return 0;
    let t = 0;
    if (m[1]) t += parseInt(m[1]) * 3600;
    if (m[2]) t += parseInt(m[2]) * 60;
    if (m[3]) t += parseInt(m[3]);
    return t;
}

function escapeHtml(t) {
    const d = document.createElement('div');
    d.textContent = t == null ? '' : t;
    return d.innerHTML;
}

function timeAgo(iso) {
    if (!iso) return '';
    const diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (diff < 3600) return Math.floor(diff / 60) + ' دقيقة';
    if (diff < 86400) return Math.floor(diff / 3600) + ' ساعة';
    if (diff < 2592000) return Math.floor(diff / 86400) + ' يوم';
    if (diff < 31536000) return Math.floor(diff / 2592000) + ' شهر';
    return Math.floor(diff / 31536000) + ' سنة';
}

        fetchSuggestions(q);

// Fetch suggestions from Google Suggest API (free, no key needed)
async function fetchSuggestions(query) {
    try {
        const url = `https://suggestqueries.google.com/complete/search?client=firefox&ds=yt&hl=ar&q=${encodeURIComponent(query)}`;
        const res = await fetch(url);
        const data = await res.json();
        
        if (data && data[1] && data[1].length > 0) {
            currentSuggestions = data[1].slice(0, 10);
            renderSuggestions(currentSuggestions, query);
        } else {
            suggestionsBox.classList.remove('show');
        }
    } catch (e) {
        // Fallback: try JSONP-like approach with CORS proxy
        try {
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://suggestqueries.google.com/complete/search?client=firefox&ds=yt&hl=ar&q=${encodeURIComponent(query)}`)}`;
            const res = await fetch(proxyUrl);
            const data = await res.json();
            if (data && data[1]) {
                currentSuggestions = data[1].slice(0, 10);
                renderSuggestions(currentSuggestions, query);
            }
        } catch (err) {
            console.log('Suggestions unavailable');
        }
    }
}

function renderSuggestions(suggestions, query) {
    if (!suggestions.length) {
        suggestionsBox.classList.remove('show');
        return;
    }
    
    const q = query.toLowerCase();
    suggestionsBox.innerHTML = suggestions.map(s => {
        const lower = s.toLowerCase();
        const idx = lower.indexOf(q);
        let highlighted = escapeHtml(s);
        if (idx >= 0) {
            highlighted = escapeHtml(s.substring(0, idx)) + 
                          '<b>' + escapeHtml(s.substring(idx, idx + query.length)) + '</b>' + 
                          escapeHtml(s.substring(idx + query.length));
        }
        return `
            <button class="suggestion-item" data-suggestion="${escapeHtml(s)}">
                <span class="icon">🔍</span>
                <span class="text">${highlighted}</span>
                <span class="arrow">↖</span>
            </button>
        `;
    }).join('');
    
    suggestionsBox.classList.add('show');
    
    suggestionsBox.querySelectorAll('.suggestion-item').forEach(btn => {
        btn.addEventListener('click', () => {
            const s = btn.dataset.suggestion;
            searchInput.value = s;
            suggestionsBox.classList.remove('show');
            searchClearBtn.classList.add('show');
            currentQuery = s;
            currentCategory = 'search';
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            loadVideos(true);
        });
    });
}

async function loadVideos(reset = false) {
    if (isLoading) return;
    isLoading = true;

    const feed = $('feed');
    if (reset) {
        nextPageToken = '';
        renderSkeletons();
    }

    try {
        let query = currentQuery || CATEGORY_QUERIES[currentCategory] || 'trending';
        
        let url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=20&key=${YT_API_KEY}&q=${encodeURIComponent(query)}&order=viewCount&regionCode=SA&relevanceLanguage=ar`;
        
        if (nextPageToken && !reset) url += `&pageToken=${nextPageToken}`;

        const res = await fetch(url);
        if (!res.ok) throw new Error('API error');
        const data = await res.json();

        if (!data.items || data.items.length === 0) {
            if (reset) renderEmpty('لا توجد نتائج');
            isLoading = false;
            return;
        }

        nextPageToken = data.nextPageToken || '';
        const ids = data.items.map(i => i.id.videoId).filter(Boolean).join(',');
        
        let detailsMap = {};
        if (ids) {
            const detailsRes = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=contentDetails,statistics&id=${ids}&key=${YT_API_KEY}`);
            const detailsData = await detailsRes.json();
            if (detailsData.items) {
                detailsData.items.forEach(i => {
                    detailsMap[i.id] = {
                        duration: parseISO(i.contentDetails.duration),
                        views: i.statistics.viewCount
                    };
                });
            }
        }

        const videos = data.items.map(item => {
            const vid = item.id.videoId;
            const d = detailsMap[vid] || {};
            return {
                id: vid,
                title: item.snippet.title,
                channel: item.snippet.channelTitle,
                thumb: `https://i.ytimg.com/vi/${vid}/mqdefault.jpg`,
                published: item.snippet.publishedAt,
                duration: d.duration || 0,
                views: d.views || 0
            };
        }).filter(v => v.id);

        if (reset) {
            feed.innerHTML = '';
        }

        // Insert videos with ad cards
        let counter = 0;
        videos.forEach((v) => {
            feed.appendChild(createVideoCard(v));
            counter++;
            
            // Every 4 videos, add an ad
            if (counter === 4) {
                feed.appendChild(createAdCard('wide'));
            }
            // Every 8 videos, another ad
            if (counter === 8) {
                feed.appendChild(createAdCard('regular'));
            }
            // Every 12 videos, another ad
            if (counter === 12) {
                feed.appendChild(createAdCard('tall'));
            }
        });

        requestAnimationFrame(lazyLoadImages);

    } catch (err) {
        console.error(err);
        if (reset) renderEmpty('❌ تعذر التحميل — تحقق من الاتصال');
    } finally {
        isLoading = false;
    }
}

        </style></head><body><div class="ad-box"><div class="ad-logo">▶</div><div class="ad-content"><div class="ad-title">انضم إلى YOUTUBE</div><div class="ad-desc">اشترك في القنوات المفضلة لديك</div><a class="ad-cta" href="#" target="_blank">اشترك الآن</a></div></div></body></html>`
    ];
    
    iframe.srcdoc = adVariants[Math.floor(Math.random() * adVariants.length)];

// ============================================
// Create Video Card
// ============================================
function createVideoCard(v) {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'video-card';
    card.dataset.id = v.id;
    card.innerHTML = `
        <div class="v-thumb">
            <img data-src="${v.thumb}" alt="" loading="lazy">
            ${v.duration ? `<span class="duration">${formatDuration(v.duration)}</span>` : ''}
        </div>
        <div class="v-body">
            <div class="v-avatar">${escapeHtml(v.channel.charAt(0))}</div>
            <div class="v-text">
                <div class="v-title">${escapeHtml(v.title)}</div>
                <div class="v-meta">
                    ${escapeHtml(v.channel)}
                    <span class="v-dot">•</span>
                    ${formatViews(v.views)} مشاهدة
                    <span class="v-dot">•</span>
                    ${timeAgo(v.published)}
                </div>
            </div>
        </div>
    `;
    card.addEventListener('click', () => playVideo(v));
    return card;
}

// ============================================
// Lazy Images
// ============================================
let imageObserver = null;
if ('IntersectionObserver' in window) {
    imageObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const img = entry.target;
                const src = img.dataset.src;
                if (src) {
                    img.src = src;
                    img.onload = () => img.classList.add('loaded');
                    img.onerror = () => {
                        img.src = src.replace('/mqdefault.jpg', '/hqdefault.jpg');
                    };
                    img.removeAttribute('data-src');
                }
                imageObserver.unobserve(img);
            }
        });
    }, { rootMargin: '400px', threshold: 0.01 });
}

function lazyLoadImages() {
    document.querySelectorAll('img[data-src]').forEach(img => {
        if (imageObserver) imageObserver.observe(img);
        else { img.src = img.dataset.src; img.classList.add('loaded'); img.removeAttribute('data-src'); }
    });
}

// ============================================
// Play Video (يفتح مباشرة بدون إعلانات مزعجة)
// ============================================
function playVideo(v) {
    currentPlayingVideo = v;

    $('modalHeaderTitle').textContent = v.title.length > 45 ? v.title.substring(0, 45) + '...' : v.title;
    $('modalTitle').textContent = v.title;
    $('modalChannelAv').textContent = v.channel.charAt(0).toUpperCase();
    $('modalChannelName').textContent = v.channel;
    $('modalChannelMeta').textContent = 'قناة رسمية';
    $('modalViews').textContent = '👁️ ' + formatViews(v.views) + ' مشاهدة';
    $('modalTime').textContent = '🕐 ' + timeAgo(v.published);

    $('videoModal').classList.add('show');
    document.body.style.overflow = 'hidden';

    if (!playerReady) {
        const check = setInterval(() => {
            if (playerReady) {
                clearInterval(check);
                createPlayer(v.id);
            }
        }, 100);
    } else {
        createPlayer(v.id);
    }
}

function createPlayer(videoId) {
    if (ytPlayer && typeof ytPlayer.loadVideoById === 'function') {
        ytPlayer.loadVideoById(videoId);
        return;
    }
    $('ytPlayer').innerHTML = '';
    ytPlayer = new YT.Player('ytPlayer', {
        height: '100%',
        width: '100%',
        videoId: videoId,
        playerVars: {
            'autoplay': 1, 'controls': 1, 'rel': 0,
            'modestbranding': 1, 'playsinline': 1,
            'enablejsapi': 1, 'origin': window.location.origin,
            'fs': 1, 'iv_load_policy': 3
        },
        events: {
            'onReady': e => e.target.playVideo(),
            'onError': e => console.error('Player error:', e.data)
        }
    });
}

// ============================================
// Fullscreen
// ============================================
function enterFullscreen() {
    const container = $('videoModalContainer');
    const modal = $('videoModal');
    
    const fsRequest = container.requestFullscreen ||
                      container.webkitRequestFullscreen ||
                      container.mozRequestFullScreen ||
                      container.msRequestFullscreen;

    modal.classList.add('fullscreen-active');
    $('fsExitBtn').classList.add('show');
    isFullscreenMode = true;
    document.body.style.overflow = 'hidden';

    if (fsRequest) {
        try {
            fsRequest.call(container).catch(() => {});
        } catch(e) {}
    }

    showToast('⛶ ملء الشاشة');
}

function exitFullscreen() {
    const modal = $('videoModal');
    
    if (document.fullscreenElement || document.webkitFullscreenElement) {
        const exitFs = document.exitFullscreen ||
                       document.webkitExitFullscreen ||
                       document.mozCancelFullScreen ||
                       document.msExitFullscreen;
        if (exitFs) {
            try { exitFs.call(document).catch(e => {}); } catch(e) {}
        }
    }

    modal.classList.remove('fullscreen-active', 'touched');
    $('fsExitBtn').classList.remove('show');
    isFullscreenMode = false;
}

$('fullscreenBtn').addEventListener('click', enterFullscreen);
$('fsExitBtn').addEventListener('click', exitFullscreen);

$('modalCloseBtn').addEventListener('click', () => {
    if (isFullscreenMode) exitFullscreen();
    else closeModal();
});

document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        if (isFullscreenMode) exitFullscreen();
        else if ($('videoModal').classList.contains('show')) closeModal();
    }
});

['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(evt => {
    document.addEventListener(evt, () => {
        const fsEl = document.fullscreenElement || document.webkitFullscreenElement ||
                     document.mozFullScreenElement || document.msFullscreenElement;
        if (!fsEl && isFullscreenMode) {
            if ($('videoModal').classList.contains('show')) {
                $('videoModal').classList.remove('fullscreen-active', 'touched');
                $('fsExitBtn').classList.remove('show');
                isFullscreenMode = false;
            }
        }
    });
});

let touchTimer;
$('videoModal').addEventListener('touchstart', () => {
    if (isFullscreenMode) {
        $('videoModalContainer').classList.add('touched');
        clearTimeout(touchTimer);
        touchTimer = setTimeout(() => {
            $('videoModalContainer').classList.remove('touched');
        }, 3000);
    }
}, { passive: true });

// ============================================
// Modal Close
// ============================================
function closeModal() {
    if (isFullscreenMode) exitFullscreen();

    if (ytPlayer && typeof ytPlayer.stopVideo === 'function') {
        try { ytPlayer.stopVideo(); } catch(e) {}
    }
    $('videoModal').classList.remove('show');
    document.body.style.overflow = '';
    currentPlayingVideo = null;
}

$('videoModal').addEventListener('click', (e) => {
    if (e.target === $('videoModal') && !isFullscreenMode) closeModal();
});

// ============================================
// Empty
// ============================================
function renderEmpty(msg) {
    $('feed').innerHTML = `
        <div class="empty">
            <span class="icon">📭</span>
            <h3>${msg}</h3>
            <p>حاول مرة أخرى</p>
        </div>
    `;
}

// ============================================
// Infinite Scroll
// ============================================
let scrollTimeout;
window.addEventListener('scroll', () => {
    if (scrollTimeout) clearTimeout(scrollTimeout);
    scrollTimeout = setTimeout(() => {
        const scrollPos = window.innerHeight + window.scrollY;
        const docHeight = document.documentElement.offsetHeight;
        if (scrollPos >= docHeight - 800 && !isLoading && nextPageToken) {
            loadVideos(false);
        }
    }, 120);
}, { passive: true });

// ============================================
// Init
// ============================================
loadVideos(true);

console.log('📺 YOUTUBE Loaded - بدون إعلانات مزعجة');
